services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: timesheet
      POSTGRES_PASSWORD: timesheet # local-only database, not exposed beyond localhost
      POSTGRES_DB: timesheet
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timesheet -d timesheet"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: ./services/timesheet-core
    depends_on:
      db:
        condition: service_healthy
    # Optional local settings (cp .env.example .env). Missing .env is ignored; `required`
    # needs Compose 2.24.0 or later. Relative to this file's folder.
    # https://docs.docker.com/reference/compose-file/services/#env_file
    env_file:
      - path: .env
        required: false
    # `environment:` beats `env_file`, so the env_file copy of .env never replaces these.
    # https://docs.docker.com/compose/how-tos/environment-variables/envvars-precedence/
    environment:
      # Container-side address of the db service; overrides the localhost DATABASE_URL in .env.
      DATABASE_URL: postgres://timesheet:timesheet@db:5432/timesheet?sslmode=disable
      # Secrets: no value is stored here. Compose interpolates ${KEY} from the shell (~/.zshrc)
      # first, then from the root .env (gitignored, written by the owner only), so a token set
      # in either reaches the container, and an empty KEY= in .env never blanks a shell token.
      # https://docs.docker.com/compose/how-tos/environment-variables/variable-interpolation/
      SLACK_USER_TOKEN: ${SLACK_USER_TOKEN}
      TEMPO_API_TOKEN: ${TEMPO_API_TOKEN}
      JIRA_BASE_URL: ${JIRA_BASE_URL}
      JIRA_EMAIL: ${JIRA_EMAIL}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN}
      # Mavenlink, needed only when submit_targets has mavenlink. `:-` keeps compose quiet when
      # they are unset.
      MAVENLINK_API_TOKEN: ${MAVENLINK_API_TOKEN:-}
      MAVENLINK_SESSION_COOKIE: ${MAVENLINK_SESSION_COOKIE:-}
    volumes:
      - ./services/timesheet-core/config:/app/config:ro
      # Week files for activity.source: file, written by the allocation-agent collector. The
      # default activity.file_dir (../../../data/activity, relative to /app/config) resolves here.
      - ./data/activity:/data/activity:ro
    # Phase 1 is CLI-only: docker compose run --rm app plan --week 2026-W41
    # planned P3 (ADR-0007): an allocation-agent service built from ./services/allocation-agent,
    # on this network only, with no published port.
    profiles: ["cli"]

volumes:
  pgdata:
